[pytest]
testpaths = fastapi_bridge/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: suite de humo end-to-end contra infraestructura viva (opt-in, ver fastapi_bridge/tests/e2e/conftest.py; WASA_E2E=1)
    e2e_ratelimit: fase aislada del suite e2e que agota el presupuesto de rate limit (opt-in, WASA_E2E_RATELIMIT=1; corre última)
